<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANVAS LIVE 3D - Official Terminal</title>
    <!-- Firebase App & Realtime Database CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0a0d14;
            --surface-card: #131823;
            --surface-border: #222b3e;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.15);
            --live-green: #10b981;
            --live-green-bg: rgba(16, 185, 129, 0.1);
            --col-a: #38bdf8;
            --col-b: #38d399;
            --col-c: #fa78bfa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        /* Top Header Board */
        .header-container {
            background: linear-gradient(180deg, #111827 0%, var(--surface-card) 100%);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
            cursor: pointer;
        }

        .brand-title span {
            color: var(--accent-gold);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--surface-border);
            color: var(--text-muted);
        }

        .status-badge.live {
            background: var(--live-green-bg);
            color: var(--live-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-badge.live .status-dot {
            box-shadow: 0 0 8px var(--live-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .info-card {
            background: rgba(10, 13, 20, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 8px 10px;
        }

        .info-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .info-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        /* Tab Switchers */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--surface-border);
            background: var(--surface-card);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        /* Results Table Layout */
        .table-container {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .table-header-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            padding: 10px 12px;
            background: rgba(10, 13, 20, 0.8);
            border-bottom: 1px solid var(--surface-border);
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-align: center;
        }

        .table-header-row div:first-child {
            text-align: left;
        }

        .slot-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            padding: 12px;
            border-bottom: 1px solid var(--surface-border);
            align-items: center;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }

        .slot-row:last-child {
            border-bottom: none;
        }

        .slot-row.current-active {
            background: rgba(245, 158, 11, 0.05);
            border-left: 3px solid var(--accent-gold);
        }

        .slot-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .slot-val {
            font-size: 14px;
            font-weight: 700;
        }

        .val-a { color: var(--col-a); }
        .val-b { color: var(--col-b); }
        .val-c { color: #f472b6; }
        .val-empty { color: var(--text-muted); opacity: 0.4; }

        /* Admin Deck Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 11, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            padding: 10px;
        }

        .modal-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 16px 16px 12px 12px;
            width: 100%;
            max-width: 450px;
            padding: 16px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-gold);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 4px;
            display: block;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px;
            background: var(--bg-body);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-gold);
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn-danger { background: #ef4444; color: #fff; }
        .btn-success { background: var(--live-green); color: #fff; }
        .btn-secondary { background: var(--surface-border); color: var(--text-main); margin-top: 8px; }

        .blocked-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .chip {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chip span { cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Header Panel -->
    <div class="header-container">
        <div class="brand-row">
            <div class="brand-title" id="secretHeaderTrigger">CANVAS <span>LIVE 3D</span></div>
            <div class="status-badge" id="marketBadge">
                <div class="status-dot"></div>
                <span id="marketStatusText">CLOSED</span>
            </div>
        </div>
        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">Live Countdown</div>
                <div class="info-value" id="countdownTimer">--:--:--</div>
            </div>
            <div class="info-card">
                <div class="info-label">Target Slot</div>
                <div class="info-value" id="targetSlotText">--:--</div>
            </div>
        </div>
    </div>

    <!-- Switch Tabs -->
    <div class="tabs-container">
        <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">TODAY RESULTS</button>
        <button class="tab-btn" id="tabYesterday" onclick="switchTab('yesterday')">YESTERDAY</button>
    </div>

    <!-- Data Grid Table -->
    <div class="table-container">
        <div class="table-header-row">
            <div>TIME SLOT</div>
            <div>SECTION A</div>
            <div>SECTION B</div>
            <div>SECTION C</div>
        </div>
        <div id="resultsTableBody">
            <!-- Dynamic Slots Rendered Here -->
        </div>
    </div>

    <!-- Admin Deck Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <div class="modal-title">
                ADMIN CONTROL DECK
                <span style="font-size:10px; color:var(--text-muted); cursor:pointer;" onclick="closeAdminPanel()">✕ CLOSE</span>
            </div>
            
            <div class="form-group">
                <label class="form-label">⛔ Block Numbers</label>
                <input type="text" class="form-input" id="blockInput" placeholder="e.g. 123, 456">
                <button class="btn-action btn-danger" onclick="saveBlockedNumbers()">BLOCK NUMBERS</button>
                <div class="blocked-chips" id="blockedChipsContainer"></div>
            </div>

            <div class="form-group" style="margin-top:16px;">
                <label class="form-label" style="color:var(--accent-gold);">Manual Result Fixer</label>
                <select class="form-select" id="fixSlotSelect">
                    <option value="">Select Time Slot</option>
                </select>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:6px;">
                    <input type="text" class="form-input" id="fixA" placeholder="A" maxlength="3">
                    <input type="text" class="form-input" id="fixB" placeholder="B" maxlength="3">
                    <input type="text" class="form-input" id="fixC" placeholder="C" maxlength="3">
                </div>
                <button class="btn-action btn-success" onclick="queueManualResult()">QUEUE FIXED RESULT</button>
            </div>

            <button class="btn-action btn-secondary" onclick="closeAdminPanel()">CLOSE PANEL</button>
        </div>
    </div>

    <!-- Script Integration -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAdve5TPA6o3rhUcLWJ5uljpQMHCjR6jJk",
            authDomain: "canvas-live-result.firebaseapp.com",
            databaseURL: "https://canvas-live-result-default-rtdb.firebaseio.com",
            projectId: "canvas-live-result",
            storageBucket: "canvas-live-result.firebasestorage.app",
            messagingSenderId: "965825756546",
            appId: "1:965825756546:web:5d7ac955ccd11e9aa9639b",
            measurementId: "G-HDS4P978KQ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const timeSlots = [
            "09:00 AM", "09:15 AM", "09:30 AM", "09:45 AM",
            "10:00 AM", "10:15 AM", "10:30 AM", "10:45 AM",
            "11:00 AM", "11:15 AM", "11:30 AM", "11:45 AM",
            "12:00 PM", "12:15 PM", "12:30 PM", "12:45 PM",
            "01:00 PM", "01:15 PM", "01:30 PM", "01:45 PM",
            "02:00 PM", "02:15 PM", "02:30 PM", "02:45 PM",
            "03:00 PM", "03:15 PM", "03:30 PM", "03:45 PM",
            "04:00 PM", "04:15 PM", "04:30 PM", "04:45 PM",
            "05:00 PM", "05:15 PM", "05:30 PM", "05:45 PM",
            "06:00 PM", "06:15 PM", "06:30 PM", "06:45 PM",
            "07:00 PM", "07:15 PM", "07:30 PM", "07:45 PM",
            "08:00 PM", "08:15 PM", "08:30 PM", "08:45 PM",
            "09:00 PM", "09:15 PM", "09:30 PM", "09:45 PM",
            "10:00 PM"
        ];

        let currentActiveTab = 'today';
        let remoteData = { results: {}, blocked: [], manualFixes: {} };

        const slotSelect = document.getElementById('fixSlotSelect');
        timeSlots.forEach(slot => {
            let opt = document.createElement('option');
            opt.value = slot;
            opt.textContent = slot;
            slotSelect.appendChild(opt);
        });

        db.ref('canvasLiveState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                remoteData = data;
            }
            renderTable();
            renderAdminBlockedChips();
        });

        function switchTab(tab) {
            currentActiveTab = tab;
            document.getElementById('tabToday').classList.toggle('active', tab === 'today');
            document.getElementById('tabYesterday').classList.toggle('active', tab === 'yesterday');
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = '';

            timeSlots.forEach(slot => {
                let sourceObj = (currentActiveTab === 'today') ? remoteData.results : remoteData.yesterday;
                let slotData = sourceObj && sourceObj[slot] ? sourceObj[slot] : { a: '---', b: '---', c: '---' };
                
                let row = document.createElement('div');
                row.className = 'slot-row';
                row.innerHTML = `
                    <div class="slot-time">${slot}</div>
                    <div class="slot-val ${slotData.a === '---' ? 'val-empty' : 'val-a'}">${slotData.a}</div>
                    <div class="slot-val ${slotData.b === '---' ? 'val-empty' : 'val-b'}">${slotData.b}</div>
                    <div class="slot-val ${slotData.c === '---' ? 'val-empty' : 'val-c'}">${slotData.c}</div>
                `;
                tbody.appendChild(row);
            });
        }

        let tapCount = 0;
        document.getElementById('secretHeaderTrigger').addEventListener('click', () => {
            tapCount++;
            if (tapCount >= 4) {
                tapCount = 0;
                let pass = prompt("Enter Admin Password:");
                if (pass === "24081996") {
                    document.getElementById('adminModal').style.display = 'flex';
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
        });

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveBlockedNumbers() {
            let inputVal = document.getElementById('blockInput').value;
            if (!inputVal) return;
            let newBlocks = inputVal.split(',').map(s => s.trim()).filter(s => s.length > 0);
            
            let currentBlocks = remoteData.blocked || [];
            let combined = Array.from(new Set([...currentBlocks, ...newBlocks]));

            db.ref('canvasLiveState/blocked').set(combined).then(() => {
                document.getElementById('blockInput').value = '';
                alert("Blocked numbers updated successfully!");
            });
        }

        function removeBlock(num) {
            let currentBlocks = remoteData.blocked || [];
            let updated = currentBlocks.filter(n => n !== num);
            db.ref('canvasLiveState/blocked').set(updated);
        }

        function renderAdminBlockedChips() {
            let container = document.getElementById('blockedChipsContainer');
            container.innerHTML = '';
            let blocks = remoteData.blocked || [];
            if (blocks.length === 0) {
                container.innerHTML = '<span style="font-size:10px; color:var(--text-muted);">No numbers blocked.</span>';
                return;
            }
            blocks.forEach(num => {
                let chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerHTML = `${num} <span onclick="removeBlock('${num}')">×</span>`;
                container.appendChild(chip);
            });
        }

        function queueManualResult() {
            let slot = document.getElementById('fixSlotSelect').value;
            let a = document.getElementById('fixA').value.trim();
            let b = document.getElementById('fixB').value.trim();
            let c = document.getElementById('fixC').value.trim();

            if (!slot || !a || !b || !c) {
                alert("Please select slot and enter all 3 values (A, B, C)");
                return;
            }

            db.ref(`canvasLiveState/manualFixes/${slot}`).set({ a, b, c }).then(() => {
                alert(`Manual result queued for ${slot}`);
                document.getElementById('fixA').value = '';
                document.getElementById('fixB').value = '';
                document.getElementById('fixC').value = '';
            });
        }
    </script>
</body>
</html>
