<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANVAS LIVE 3D - Official Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #0a0d14;
            --surface-card: #131823;
            --surface-border: #222b3e;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.3);
            --live-green: #10b981;
            --live-green-bg: rgba(16, 185, 129, 0.15);
            --col-a: #38bdf8;
            --col-b: #38d399;
            --col-c: #fa78bfa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        header { background: var(--surface-card); border: 1px solid var(--surface-border); border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--accent-gold); letter-spacing: 1px; margin-bottom: 5px; text-shadow: 0 0 10px var(--accent-gold-glow); }
        .live-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--live-green-bg); color: var(--live-green); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.3); }
        .live-dot { width: 8px; height: 8px; background: var(--live-green); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        .card { background: var(--surface-card); border: 1px solid var(--surface-border); border-radius: 12px; padding: 15px; }
        .time-slot { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--surface-border); border-radius: 8px; margin-bottom: 8px; }
        .time-label { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
        .result-box { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--accent-gold); background: rgba(245, 158, 11, 0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CANVAS LIVE 3D</h1>
            <div class="live-badge">
                <span class="live-dot"></span> LIVE RESULTS (09:00 AM ONWARDS)
            </div>
        </header>
        <div class="card" id="results-container">
            <div class="time-slot">
                <span class="time-label">09:00 AM</span>
                <span class="result-box" id="res-09:00 AM">***</span>
            </div>
            <div class="time-slot">
                <span class="time-label">10:00 AM</span>
                <span class="result-box" id="res-10:00 AM">***</span>
            </div>
            <div class="time-slot">
                <span class="time-label">11:00 AM</span>
                <span class="result-box" id="res-11:00 AM">***</span>
            </div>
        </div>
    </div>
    <script>
        // Firebase configuration & sync logic here
    </script>
</body>
</html>
