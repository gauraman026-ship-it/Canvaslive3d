name: Trigger Vercel Cron

on:
  schedule:
    # IST ke 12, 27, 42, 57 minutes par exact trigger hone ke liye UTC timing:
    - cron: '42,57,12,27 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel API Endpoint
        run: |
          curl -X GET "https://canvas3d-inky.vercel.app/api/cron-result"
