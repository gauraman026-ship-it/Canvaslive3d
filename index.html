<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CANVAS LIVE 3D - Official Terminal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0a0d14;
            --surface-card: #131823;
            --surface-border: #222b3e;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.15);
            --live-green: #10b981;
            --live-green-bg: rgba(16, 185, 129, 0.1);
            --col-a: #38bdf8;
            --col-b: #34d399;
            --col-c: #a78bfa;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        /* Top Header Board */
        .header-container {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .header-title span {
            color: var(--accent-gold);
        }

        .header-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .live-badge {
            background: var(--live-green-bg);
            color: var(--live-green);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--live-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--live-green);
            animation: pulse 1.5px infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Control / Timer Box */
        .timer-container {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-info-group {
            display: flex;
            flex-direction: column;
        }

        .timer-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .timer-clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .target-slot {
            text-align: right;
        }

        .target-time-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* Tab Switchers */
        .btn-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-today {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            box-shadow: 0 4px 12px var(--accent-gold-glow);
        }

        .btn-yesterday {
            background: var(--surface-card);
            color: var(--text-muted);
        }

        /* Realistic Data Grid */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 60px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 4px;
        }

        th {
            background: rgba(19, 24, 35, 0.5);
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid var(--surface-border);
        }

        th:first-child { text-align: left; border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        th:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

        td {
            background: var(--surface-card);
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            border-top: 1px solid var(--surface-border);
            border-bottom: 1px solid var(--surface-border);
            text-align: center;
            letter-spacing: 1px;
        }

        td:first-child {
            border-left: 1px solid var(--surface-border);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            text-align: left;
        }

        td:last-child {
            border-right: 1px solid var(--surface-border);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .col-time {
            width: 34%;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        .col-a { color: var(--col-a); width: 22%; }
        .col-b { color: var(--col-b); width: 22%; }
        .col-c { color: var(--col-c); width: 22%; }

        /* Admin Console */
        #admin-panel {
            display: none;
            background: #0d111a;
            border: 1px solid var(--surface-border);
            border-top: 2px solid var(--accent-gold);
            padding: 14px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            max-height: 80vh;
            overflow-y: auto;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--surface-border);
            background: var(--bg-body);
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="header-container" onclick="handleHeaderTap()">
        <div class="header-brand">
            <div class="header-title">CANVAS <span>LIVE 3D</span></div>
            <div class="header-sub">Professional Terminal</div>
        </div>
        <div class="live-badge" id="badge-status">
            <div class="live-dot"></div> ONLINE
        </div>
    </div>
    
    <div class="timer-container">
        <div class="timer-info-group">
            <div class="timer-label" id="timer-label-text">Next Draw Countdown</div>
            <div id="timer" class="timer-clock">--:--:--</div>
        </div>
        <div class="target-slot">
            <div class="timer-label">Target Slot</div>
            <div class="target-time-val" id="draw-time">--:--</div>
        </div>
    </div>

    <div class="btn-container">
        <button id="today-btn" class="btn btn-today" onclick="loadResults('today')">Today Results</button>
        <button id="yesterday-btn" class="btn btn-yesterday" onclick="loadResults('yesterday')">Yesterday</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Time Slot</th>
                    <th>Section A</th>
                    <th>Section B</th>
                    <th>Section C</th>
                </tr>
            </thead>
            <tbody id="result-list"></tbody>
        </table>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <h3 style="margin:0 0 10px 0; color: var(--accent-gold); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Admin Control Deck</h3>
        
        <div style="background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--surface-border);">
            <p style="margin: 0 0 6px 0; font-size: 0.7rem; color: #ef4444; font-weight: bold;">🚫 Block Numbers</p>
            <input type="text" id="block-input" placeholder="e.g. 123, 456">
            <button onclick="saveBlockedNumbers()" style="width:100%; padding: 8px; background: #ef4444; color: #fff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.7rem; text-transform: uppercase;">Block Numbers</button>
            <div id="blocked-list-ui" style="font-size: 0.65rem; color: var(--text-muted); margin-top: 6px; text-align: left; max-height: 50px; overflow-y: auto;"></div>
        </div>

        <p style="margin: 0 0 4px 0; font-size: 0.7rem; color: var(--accent-gold); font-weight: bold;">Manual Result Fixer</p>
        <select id="fix-time">
            <option value="">Select Time Slot</option>
        </select>

        <div style="display:flex; gap:6px; justify-content:center; margin-bottom:8px;">
            <input type="number" id="fix-a" placeholder="A" style="width:32%; margin:0;">
            <input type="number" id="fix-b" placeholder="B" style="width:32%; margin:0;">
            <input type="number" id="fix-c" placeholder="C" style="width:32%; margin:0;">
        </div>
        <button onclick="saveFix()" style="width:100%; padding:9px; background:var(--live-green); color:#000; border:none; font-weight:bold; border-radius:6px; margin-bottom:6px; cursor:pointer; text-transform:uppercase; font-size:0.7rem;">Queue Fixed Result</button>
        <button onclick="document.getElementById('admin-panel').style.display='none'" style="width:100%; padding:8px; background:var(--surface-border); color:#fff; border:none; font-weight:bold; border-radius:6px; cursor:pointer; text-transform:uppercase; font-size:0.7rem;">Close Panel</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuY1kjzvbXT37mUccPQZgC_BbTK2RpEgM",
            authDomain: "canvas3dlivegame.firebaseapp.com",
            databaseURL: "https://canvas3dlivegame-default-rtdb.firebaseio.com",
            projectId: "canvas3dlivegame",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let blockedNumbers = [];
        let tapCount = 0;

        function handleHeaderTap() {
            tapCount++;
            if (tapCount === 4) {
                let pass = prompt("Enter Admin Password:");
                if (pass === "24081996") {
                    document.getElementById('admin-panel').style.display = 'block';
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
                tapCount = 0;
            }
            setTimeout(() => { tapCount = 0; }, 3000);
        }

        function populateTimeDropdown() {
            const selectDropdown = document.getElementById('fix-time');
            selectDropdown.innerHTML = '<option value="">Select Time Slot</option>';
            for (let h = 9; h <= 22; h++) {
                for (let m = 0; m < 60; m += 15) {
                    if (h === 22 && m > 0) break;
                    let t = `${h % 12 || 12}:${m === 0 ? '00' : m} ${h >= 12 ? 'PM' : 'AM'}`;
                    let option = document.createElement('option');
                    option.value = t;
                    option.textContent = t;
                    selectDropdown.appendChild(option);
                }
            }
        }
        populateTimeDropdown();

        db.ref('settings/blocked').on('value', (snapshot) => {
            blockedNumbers = snapshot.val() || [];
            renderBlockedUI();
        });

        function saveBlockedNumbers() {
            let inputVal = document.getElementById('block-input').value.trim();
            if(!inputVal) { alert("Please enter numbers!"); return; }
            
            let newItems = inputVal.split(/[\s,]+/);
            let addedCount = 0;

            newItems.forEach(item => {
                let val = item.trim();
                if(val && !blockedNumbers.includes(val)) {
                    blockedNumbers.push(val);
                    addedCount++;
                }
            });

            if(addedCount > 0) {
                db.ref('settings/blocked').set(blockedNumbers, () => {
                    document.getElementById('block-input').value = '';
                    alert(addedCount + " number(s) blocked successfully!");
                });
            } else {
                alert("Numbers already blocked or invalid!");
            }
        }

        function removeBlock(num) {
            blockedNumbers = blockedNumbers.filter(n => n !== num);
            db.ref('settings/blocked').set(blockedNumbers);
        }

        function renderBlockedUI() {
            let container = document.getElementById('blocked-list-ui');
            if(blockedNumbers.length === 0) {
                container.innerHTML = "No numbers blocked.";
                return;
            }
            container.innerHTML = "Blocked: " + blockedNumbers.map(n => `<span style="background:#222b3e; padding:2px 5px; border-radius:3px; margin-right:3px; display:inline-block; margin-bottom:2px; color:#ef4444;">${n} <strong onclick="removeBlock('${n}')" style="cursor:pointer; color:#fff;">×</strong></span>`).join('');
        }

        function saveFix() {
            let timeSlot = document.getElementById('fix-time').value;
            let a = document.getElementById('fix-a').value;
            let b = document.getElementById('fix-b').value;
            let c = document.getElementById('fix-c').value;

            if(!timeSlot || !a || !b || !c) {
                alert("Please select time slot and fill all A, B, C values!");
                return;
            }

            db.ref('fixed_results/' + timeSlot).set({A: a, B: b, C: c}, () => {
                alert("Result successfully queued for " + timeSlot);
                document.getElementById('fix-a').value = '';
                document.getElementById('fix-b').value = '';
                document.getElementById('fix-c').value = '';
            });
        }

        function isBlocked(numStr) {
            let s = String(numStr).padStart(3, '0');
            let sortedS = s.split('').sort().join('');

            for(let b of blockedNumbers) {
                let cleanB = String(b).trim();
                if(s === cleanB || s.includes(cleanB)) return true;
                if(cleanB.length === 3 && sortedS === cleanB.split('').sort().join('')) return true;
            }
            return false;
        }

        function generateValidRandom() {
            let num, safety = 0;
            do {
                num = Math.floor(100 + Math.random() * 900);
                safety++;
                if(safety > 200) break;
            } while(isBlocked(num));
            return num;
        }

        function updateTimer() {
            const now = new Date();
            let hrs = now.getHours();
            let mins = now.getMinutes();
            let s = now.getSeconds();

            const timerElement = document.getElementById('timer');
            const drawTimeElement = document.getElementById('draw-time');
            const timerLabelText = document.getElementById('timer-label-text');
            const badgeStatus = document.getElementById('badge-status');

            if (hrs < 9 || hrs > 22) {
                timerElement.innerText = "CLOSED";
                timerLabelText.innerText = "MARKET STATUS";
                drawTimeElement.innerText = "--:--";
                badgeStatus.innerHTML = `<div class="live-dot" style="background:#ef4444; box-shadow:0 0 8px #ef4444;"></div> CLOSED`;
                badgeStatus.style.background = "rgba(239, 68, 68, 0.1)";
                badgeStatus.style.color = "#ef4444";
                badgeStatus.style.borderColor = "rgba(239, 68, 68, 0.2)";
                return;
            }

            let nextDraw = new Date(now);
            let nextMins = Math.ceil((mins + 1) / 15) * 15;
            let nextHrs = hrs;
            if (nextMins >= 60) { nextMins = 0; nextHrs++; }
            
            nextDraw.setHours(nextHrs, nextMins, 0);
            const diff = nextDraw - now;
            
            if(diff <= 0) {
                timerElement.innerText = "00:00:00";
                return;
            }

            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const sec = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            
            timerElement.innerText = `${h}:${m}:${sec}`;
            drawTimeElement.innerText = nextDraw.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if ((mins % 15 === 0) && s === 0) {
                const drawStr = nextDraw.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                db.ref('fixed_results/' + drawStr).once('value', snapshot => {
                    let a, b, c;
                    if(snapshot.exists()){ 
                        a = snapshot.val().A; 
                        b = snapshot.val().B; 
                        c = snapshot.val().C; 
                        db.ref('fixed_results/' + drawStr).remove(); 
                    } else { 
                        a = generateValidRandom(); 
                        b = generateValidRandom(); 
                        c = generateValidRandom(); 
                    }
                    db.ref('results/today/' + drawStr).set({A: a, B: b, C: c});
                });
            }
        }
        setInterval(updateTimer, 1000);

        let activeListener = null;
        function loadResults(type) {
            const list = document.getElementById('result-list');
            
            if(type === 'today') {
                document.getElementById('today-btn').className = 'btn btn-today';
                document.getElementById('yesterday-btn').className = 'btn btn-yesterday';
            } else {
                document.getElementById('yesterday-btn').className = 'btn btn-today';
                document.getElementById('today-btn').className = 'btn btn-yesterday';
            }

            if (activeListener) {
                db.ref('results/' + (type === 'today' ? 'yesterday' : 'today')).off('value', activeListener);
            }

            activeListener = db.ref('results/' + type).on('value', (snapshot) => {
                list.innerHTML = "";
                const data = snapshot.val() || {};
                for (let h = 9; h <= 22; h++) {
                    for (let m = 0; m < 60; m += 15) {
                        if (h === 22 && m > 0) break;
                        let t = `${h % 12 || 12}:${m === 0 ? '00' : m} ${h >= 12 ? 'PM' : 'AM'}`;
                        let res = data[t] || {A: '---', B: '---', C: '---'};
                        
                        let row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="col-time">${t}</td>
                            <td class="col-a">${res.A}</td>
                            <td class="col-b">${res.B}</td>
                            <td class="col-c">${res.C}</td>
                        `;
                        list.prepend(row);
                    }
                }
            });
        }
        loadResults('today');
    </script>
</body>
</html>
