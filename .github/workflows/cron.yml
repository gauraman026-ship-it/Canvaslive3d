name: Trigger Vercel Cron

on:
  schedule:
    # Yeh UTC time hai jo IST ke 14, 29, 44, 59 minutes par chalega
    - cron: '44,59,14,29 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel API Endpoint
        run: |
          curl -X GET "https://canvas3d-inky.vercel.app/api/cron-result"
